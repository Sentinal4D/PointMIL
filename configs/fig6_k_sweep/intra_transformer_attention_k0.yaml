# Generated by scripts/make_configs.py. Every hyperparameter is explicit; see docs/EXPERIMENTS.md.
experiment:
  name: fig6_intra_transformer_attention_k0
  recipe: pointmil
  paper: Fig. 6 k sweep (k=0); Supp. Table 3 (no context)
seed: 42
data:
  name: intra
  root: ${POINTMIL_DATA}/IntrA
  split_dir: splits/intra
  num_points: 1024
  sampling: random
  normalise: true
  feature_keys:
  - pos
  - normals
  batch_size: 8
  val_batch_size: 8
  num_workers: 4
  train_transforms:
  - name: random_scale_translate
    scale:
    - 0.8
    - 1.2
    shift: 0.2
  test_transforms: []
model:
  backbone:
    name: transformer
    in_channels: 6
    coord_dims: 3
    num_k:
    - 32
    - 64
    channel_dim:
    - 128
    - 256
    channel_raise:
    - 64
    - 256
    dim_k: 32
    heads: 8
  pooling:
    name: attention
    num_classes: 2
    dropout: 0.1
    attention_hidden: 8
    non_linear: false
    non_linear_v1: false
    positional_encoding: true
    contextual_attention: false
    context_k: 12
    num_points: 1024
train:
  epochs: 300
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.0001
  scheduler:
    name: cosine
    t_max: 300
    min_lr: 1.0e-06
    warmup_epochs: 0
  loss:
    name: cross_entropy
    label_smoothing: 0.0
  grad_clip: null
  checkpoint_monitor: val_f1
  early_stopping_patience: 300
  val_split: test
  drop_last: true
  deterministic: true
