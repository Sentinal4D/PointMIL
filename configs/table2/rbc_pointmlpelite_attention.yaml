# Generated by scripts/make_configs.py. Every hyperparameter is explicit; see docs/EXPERIMENTS.md.
experiment:
  name: table2_rbc_pointmlpelite_attention
  recipe: openpoints
  paper: Table 2 RBC PointMIL(PointMLPElite dagger)
seed: 42
data:
  name: rbc
  root: ${POINTMIL_DATA}/RBC
  split_dir: splits/rbc
  num_points: 1024
  sampling: random
  normalise: true
  feature_keys:
  - pos
  batch_size: 8
  val_batch_size: 8
  num_workers: 4
  train_transforms: []
  test_transforms: []
model:
  backbone:
    name: pointmlp_elite
    in_channels: 3
    reducers:
    - 1
    - 1
    - 1
    - 1
  pooling:
    name: openpoints
    pooling: attention
    num_classes: 9
    instance_head: linear
    num_points: 1024
    mlp_dims:
    - 512
    - 256
    dropout: 0.5
    attention_hidden: 8
    attention_classifier: mlp
train:
  epochs: 100
  optimizer:
    name: sgd
    lr: 0.1
    weight_decay: 0.0002
    filter_bias_and_bn: true
    momentum: 0.9
  scheduler:
    name: cosine
    t_max: 100
    min_lr: 0.005
    warmup_epochs: 0
  loss:
    name: cross_entropy
    label_smoothing: 0.2
  grad_clip: 1
  checkpoint_monitor: val_oacc
  early_stopping_patience: 0
  val_split: test
  drop_last: true
  deterministic: true
