# Generated by scripts/make_configs.py. Every hyperparameter is explicit; see docs/EXPERIMENTS.md.
experiment:
  name: table2_atlas1_curvenet_gap
  recipe: openpoints
  paper: Table 2 ATLAS-1 PointMIL(curvenet) / dagger baseline (GAP)
seed: 42
data:
  name: atlas1
  root: ${POINTMIL_DATA}/ATLAS-1
  split_file: splits/atlas1/split0.csv
  source: points
  num_points: 1024
  sampling: fps
  normalise: true
  feature_keys:
  - pos
  batch_size: 16
  val_batch_size: 16
  num_workers: 6
  train_transforms: []
  test_transforms: []
model:
  backbone:
    name: openpoints_curvenet
    num_classes: 3
    k: 20
    num_points: 1024
  pooling:
    name: openpoints
    pooling: gap
    num_classes: 3
    instance_head: mlp_bn_points
    num_points: 1024
    mlp_dims:
    - 512
    - 256
    dropout: 0.5
    attention_hidden: 8
train:
  epochs: 100
  optimizer:
    name: sgd
    lr: 0.1
    weight_decay: 0.0002
    filter_bias_and_bn: true
    momentum: 0.9
  scheduler:
    name: cosine
    t_max: 100
    min_lr: 0.005
    warmup_epochs: 0
  loss:
    name: cross_entropy
    label_smoothing: 0.2
  grad_clip: 1
  checkpoint_monitor: val_oacc
  early_stopping_patience: 0
  val_split: test
  drop_last: true
  deterministic: true
