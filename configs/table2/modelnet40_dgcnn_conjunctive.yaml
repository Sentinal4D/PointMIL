# Generated by scripts/make_configs.py. Every hyperparameter is explicit; see docs/EXPERIMENTS.md.
experiment:
  name: table2_modelnet40_dgcnn_conjunctive
  recipe: pointmil
  paper: Table 2 ModelNet40 PointMIL(DGCNN)
seed: 42
data:
  name: modelnet40
  root: ${POINTMIL_DATA}/ModelNet40
  num_points: 1024
  sampling: first
  normalise: false
  feature_keys:
  - pos
  batch_size: 32
  val_batch_size: 32
  num_workers: 6
  train_transforms:
  - name: dgcnn_scale_translate
    scale:
    - 0.6666666666666666
    - 1.5
    shift: 0.2
  - name: shuffle_points
  test_transforms: []
model:
  backbone:
    name: dgcnn
    k: 20
    emb_dims: 1024
  pooling:
    name: conjunctive
    num_classes: 40
    dropout: 0.5
    attention_hidden: 8
    non_linear: true
    non_linear_v1: false
    positional_encoding: false
    contextual_attention: true
    context_k: 12
    num_points: 1024
train:
  epochs: 250
  optimizer:
    name: sgd
    lr: 0.1
    weight_decay: 0.0001
    momentum: 0.9
  scheduler:
    name: cosine
    t_max: 250
    min_lr: 0.001
    warmup_epochs: 0
  loss:
    name: cross_entropy
    label_smoothing: 0.0
  grad_clip: null
  checkpoint_monitor: val_oacc
  early_stopping_patience: 250
  val_split: test
  drop_last: true
  deterministic: true
