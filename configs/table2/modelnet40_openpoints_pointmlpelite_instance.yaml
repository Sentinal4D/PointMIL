# Generated by scripts/make_configs.py. Every hyperparameter is explicit; see docs/EXPERIMENTS.md.
experiment:
  name: table2_modelnet40_openpoints_pointmlpelite_instance
  recipe: openpoints
  paper: ModelNet40 PointMIL(pointmlpelite) with the PointNeXt / OpenPoints training
    recipe
seed: 42
data:
  name: modelnet40
  root: ${POINTMIL_DATA}/ModelNet40
  num_points: 1024
  sampling: first
  normalise: false
  feature_keys:
  - pos
  batch_size: 32
  val_batch_size: 64
  num_workers: 6
  train_transforms:
  - name: shuffle_points
  - name: points_to_tensor
  - name: scale_and_translate
    scale:
    - 0.6666666666666666
    - 1.5
    shift:
    - 0.2
    - 0.2
    - 0.2
  test_transforms:
  - name: points_to_tensor
model:
  backbone:
    name: pointmlp_elite
    in_channels: 3
    reducers:
    - 1
    - 1
    - 1
    - 1
  pooling:
    name: openpoints
    pooling: instance
    num_classes: 40
    instance_head: linear
    num_points: 1024
    mlp_dims:
    - 512
    - 256
    dropout: 0.5
    attention_hidden: 8
train:
  epochs: 250
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.05
    filter_bias_and_bn: true
  scheduler:
    name: cosine
    t_max: 250
    min_lr: 1.0e-06
    warmup_epochs: 0
  loss:
    name: cross_entropy
    label_smoothing: 0.2
  grad_clip: 1
  checkpoint_monitor: val_oacc
  early_stopping_patience: 0
  val_split: test
  drop_last: true
  deterministic: true
