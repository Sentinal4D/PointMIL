# Generated by scripts/make_configs.py. Every hyperparameter is explicit; see docs/EXPERIMENTS.md.
experiment:
  name: table2_scanobjectnn_transformer_additive
  recipe: openpoints
  paper: Table 2 ScanObjectNN PointMIL
seed: 42
data:
  name: scanobjectnn
  root: ${POINTMIL_DATA}/ScanObjectNN
  uniform_sample: true
  num_points: 1024
  sampling: first
  normalise: false
  feature_keys:
  - pos
  - heights
  batch_size: 4
  val_batch_size: 32
  num_workers: 6
  train_transforms:
  - name: shuffle_points
  - name: points_to_tensor
  - name: scaling
    scale:
    - 0.9
    - 1.1
    anisotropic: true
  - name: center_and_normalize
    gravity_dim: 1
  - name: rotation
    angle:
    - 0.0
    - 1.0
    - 0.0
  test_transforms:
  - name: points_to_tensor
  - name: center_and_normalize
    gravity_dim: 1
model:
  backbone:
    name: transformer
    in_channels: 4
    coord_dims: 4
    num_k:
    - 32
    - 64
    channel_dim:
    - 128
    - 256
    channel_raise:
    - 64
    - 256
    dim_k: 32
    heads: 8
  pooling:
    name: openpoints
    pooling: additive
    num_classes: 15
    instance_head: mlp_bn_points
    num_points: 1024
    mlp_dims:
    - 512
    - 256
    dropout: 0.5
    attention_hidden: 8
train:
  epochs: 250
  optimizer:
    name: adamw
    lr: 0.002
    weight_decay: 0.05
    filter_bias_and_bn: true
  scheduler:
    name: cosine
    t_max: 200
    min_lr: 0.0001
    warmup_epochs: 0
  loss:
    name: cross_entropy
    label_smoothing: 0.3
  grad_clip: 10
  checkpoint_monitor: val_oacc
  early_stopping_patience: 0
  val_split: test
  drop_last: true
  deterministic: true
