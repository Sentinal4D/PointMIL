# Generated by scripts/make_configs.py. Every hyperparameter is explicit; see docs/EXPERIMENTS.md.
experiment:
  name: table2_intra_curvenet_dagger_baseline
  recipe: pointmil
  paper: Table 2 IntrA, CurveNet dagger (no MIL)
seed: 42
data:
  name: intra
  root: ${POINTMIL_DATA}/IntrA
  split_dir: splits/intra
  num_points: 1024
  sampling: random
  normalise: true
  feature_keys:
  - pos
  - normals
  batch_size: 8
  val_batch_size: 8
  num_workers: 4
  train_transforms:
  - name: random_scale_translate
    scale:
    - 0.8
    - 1.2
    shift: 0.2
  test_transforms: []
model:
  backbone:
    name: curvenet_mil
    k: 20
    instance_input: features
    num_points: 1024
  pooling:
    name: original
    num_classes: 2
train:
  epochs: 300
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.0001
  scheduler:
    name: cosine
    t_max: 300
    min_lr: 1.0e-06
    warmup_epochs: 0
  loss:
    name: cross_entropy
    label_smoothing: 0.0
  grad_clip: null
  checkpoint_monitor: val_f1
  early_stopping_patience: 300
  val_split: test
  drop_last: true
  deterministic: true
