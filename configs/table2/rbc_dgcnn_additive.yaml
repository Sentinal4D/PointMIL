# Generated by scripts/make_configs.py. Every hyperparameter is explicit; see docs/EXPERIMENTS.md.
experiment:
  name: table2_rbc_dgcnn_additive
  recipe: pointmil
  paper: Table 2 RBC PointMIL(DGCNN)
seed: 42
data:
  name: rbc
  root: ${POINTMIL_DATA}/RBC
  split_dir: splits/rbc
  num_points: 1024
  sampling: random
  normalise: true
  feature_keys:
  - pos
  batch_size: 8
  val_batch_size: 8
  num_workers: 4
  train_transforms:
  - name: random_scale_translate
    scale:
    - 0.8
    - 1.2
    shift: 0.2
  test_transforms: []
model:
  backbone:
    name: dgcnn
    k: 20
    emb_dims: 1024
  pooling:
    name: additive
    num_classes: 9
    dropout: 0.5
    attention_hidden: 8
    non_linear: true
    non_linear_v1: false
    positional_encoding: true
    contextual_attention: true
    context_k: 12
    num_points: 1024
train:
  epochs: 250
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.0001
  scheduler:
    name: cosine
    t_max: 250
    min_lr: 1.0e-06
    warmup_epochs: 0
  loss:
    name: cross_entropy
    label_smoothing: 0.0
  grad_clip: null
  checkpoint_monitor: val_f1
  early_stopping_patience: 250
  val_split: test
  drop_last: true
  deterministic: true
